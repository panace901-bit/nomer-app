<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOMER</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:Arial,sans-serif;color:#111827}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 18px 90px}.logo{font-size:30px;font-weight:900;letter-spacing:2px}.sub{color:#667085;margin:4px 0 20px}.search{width:100%;padding:16px;border:0;border-radius:16px;background:#fff;font-size:16px;box-shadow:0 1px 4px #ddd}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 25px}.chip{border:1px solid #ddd;background:white;border-radius:20px;padding:9px 13px;cursor:pointer}.title{font-size:20px;font-weight:800;margin:12px 0}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #e5e7eb;cursor:pointer}.row{display:flex;align-items:center;justify-content:space-between}.plate{display:inline-flex;align-items:center;border:2px solid #111;border-radius:5px;padding:7px 9px;font-size:19px;font-weight:900;letter-spacing:1px;background:#fff}.region{border-left:1px solid #111;margin-left:8px;padding-left:8px;text-align:center;font-size:14px}.rus{font-size:8px}.price{font-size:21px;font-weight:900;margin-top:14px}.car{font-weight:700;margin-top:4px}.city{color:#667085;margin-top:3px}.heart{font-size:24px;border:0;background:none;cursor:pointer}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:12px 4px}.nav button{border:0;background:none;font-size:12px}.note{font-size:12px;color:#667085;margin-top:30px}</style></head><body><main class="app"><div class="logo">NOMER</div><div class="sub">Найди свой номер</div><input id="q" class="search" placeholder="Поиск: 777, А***АА, регион 196…"><div class="chips"><button class="chip">777</button><button class="chip">001</button><button class="chip">999</button><button class="chip">007</button><button class="chip">ААА</button><button class="chip">МММ</button></div><div class="title">Новые объявления</div><section id="list"></section><div class="note">Демонстрационная версия. NOMER не является государственным сервисом регистрации транспортных средств.</div></main><nav class="nav"><button>⌂<br>Главная</button><button>⌕<br>Поиск</button><button>⊕<br>Продать</button><button>☵<br>Чаты</button><button>○<br>Профиль</button></nav><script>const data=[['А 777 АА','196','850 000 ₽','Mercedes-Benz E 200','Екатеринбург'],['М 001 ММ','77','1 500 000 ₽','BMW X5','Москва'],['О 999 ОО','777','620 000 ₽','Audi Q7','Москва'],['Е 007 КХ','96','390 000 ₽','Haval Jolion','Екатеринбург']];const list=document.querySelector('#list'),q=document.querySelector('#q');function render(s=''){let x=s.toUpperCase().replaceAll(' ','');list.innerHTML=data.filter(a=>a.join(' ').toUpperCase().replaceAll(' ','').includes(x)).map(a=>`<article class="card"><div class="row"><div class="plate">${a[0]}<span class="region">${a[1]}<div class="rus">RUS</div></span></div><button class="heart" onclick="this.textContent=this.textContent==='♡'?'♥':'♡'">♡</button></div><div class="price">${a[2]}</div><div class="car">${a[3]}</div><div class="city">${a[4]}</div></article>`).join('')}q.oninput=()=>render(q.value);document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{q.value=b.textContent;render(b.textContent)});render();</script></body></html>
